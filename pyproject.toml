[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-event-recon"
version = "0.1.0"
description = "Event discovery, key-account watch a pre-event recon pro Etnetera Flow"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
recon = "recon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
